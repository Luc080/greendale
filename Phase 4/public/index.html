<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Greendale</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --green-dark: #2d5a27;
  --green-mid:  #4a8c42;
  --amber:  #f0a500;
  --red:    #e05252;
  --blue:   #4a90d9;
  --ui-border: #d4b896;
  --shadow: rgba(0,0,0,0.18);
  --text:   #3a2a1a;
  --text-light: #7a6a5a;
  --panel:  rgba(255,248,235,0.97);
  --casino-gold: #ffd700;
  --casino-dark: #1a0a2a;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Nunito',sans-serif; background:#5a9e50; overflow:hidden; user-select:none; }

/* ===== JOIN SCREEN ===== */
#join-screen {
  position:fixed; inset:0; background:linear-gradient(135deg,#2d5a27,#4a8c42);
  display:flex; align-items:center; justify-content:center; z-index:100;
}
.join-card {
  background:var(--panel); border-radius:20px; padding:32px 40px;
  box-shadow:0 8px 40px rgba(0,0,0,0.35); min-width:320px; text-align:center;
}
.join-title { font-size:28px; font-weight:900; color:var(--green-dark); margin-bottom:6px; }
.join-sub   { font-size:13px; color:var(--text-light); margin-bottom:20px; }
.join-input {
  width:100%; padding:10px 14px; border-radius:10px; border:2px solid var(--ui-border);
  font-family:'Nunito',sans-serif; font-size:14px; font-weight:700; margin-bottom:10px;
  outline:none; transition:border-color 0.2s;
}
.join-input:focus { border-color:var(--green-mid); }
.join-btn {
  width:100%; padding:11px; border-radius:12px; border:none;
  background:var(--green-dark); color:#fff; font-family:'Nunito',sans-serif;
  font-weight:900; font-size:15px; cursor:pointer; transition:background 0.15s;
  margin-top:4px;
}
.join-btn:hover { background:var(--green-mid); }
#join-error { color:var(--red); font-size:11px; margin-top:6px; min-height:14px; }

/* ===== GAME CONTAINER ===== */
#game-container { display:none; width:100vw; height:100vh; }

/* ===== TOPBAR ===== */
#topbar {
  display:flex; align-items:center; gap:6px; padding:6px 12px;
  background:var(--panel); border-bottom:2px solid var(--ui-border);
  box-shadow:0 2px 8px var(--shadow); z-index:10; flex-wrap:wrap;
  height:52px; flex-shrink:0;
}
.game-title { font-size:17px; font-weight:900; color:var(--green-dark); margin-right:2px; }
.res-chip {
  display:flex; align-items:center; gap:3px; background:#fff;
  border:2px solid var(--ui-border); border-radius:20px;
  padding:2px 9px; font-size:12px; font-weight:700; color:var(--text);
}
.res-val { min-width:22px; text-align:right; }
#time-chip   { background:var(--green-dark); color:#fff; border-radius:20px; padding:2px 10px; font-size:12px; font-weight:700; }
#xp-chip     { background:var(--amber); color:#fff; border-radius:20px; padding:2px 10px; font-size:12px; font-weight:700; }
#coins-chip  { background:#7a20c0; color:var(--casino-gold); border-radius:20px; padding:2px 10px; font-size:12px; font-weight:800; border:1.5px solid var(--casino-gold); }
#level-chip  { background:var(--green-dark); color:#fff; border-radius:20px; padding:2px 10px; font-size:12px; font-weight:700; }
#save-btn    { margin-left:auto; padding:3px 10px; border-radius:14px; border:2px solid var(--green-mid); background:var(--green-dark); color:#fff; font-family:'Nunito',sans-serif; font-weight:700; font-size:11px; cursor:pointer; }
#connection-status { font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:#f0ebe0; }

/* Level-Bar */
#level-bar { width:80px; height:6px; background:#e0d8cc; border-radius:3px; overflow:hidden; }
#level-bar-fill { height:100%; background:var(--amber); border-radius:3px; transition:width 0.4s; }

/* ===== MAIN ROW ===== */
#main-row { display:flex; flex:1; min-height:0; }

/* ===== CANVAS AREA ===== */
#canvas-col { flex:1; display:flex; flex-direction:column; min-width:0; }
#canvas-wrap { flex:1; position:relative; overflow:hidden; min-height:0; }
canvas { display:block; }

/* ===== EVENT BANNER ===== */
#event-banner {
  display:none; position:absolute; top:8px; left:50%; transform:translateX(-50%);
  background:linear-gradient(90deg,#f0a500,#ff6020); color:#fff;
  border-radius:20px; padding:5px 16px; font-size:11px; font-weight:800;
  z-index:15; gap:8px; align-items:center; box-shadow:0 3px 12px rgba(240,165,0,0.4);
  white-space:nowrap; pointer-events:none;
}
.event-title { font-size:12px; }
.event-prog  { opacity:0.9; }
.event-time  { background:rgba(0,0,0,0.2); border-radius:10px; padding:1px 6px; }

/* ===== BOTTOM PANEL ===== */
#bottom-panel {
  background:var(--panel); border-top:2px solid var(--ui-border);
  padding:7px 12px 8px; box-shadow:0 -2px 8px var(--shadow);
  flex-shrink:0;
}
#tabs { display:flex; gap:4px; margin-bottom:6px; flex-wrap:wrap; }
.tab-btn {
  padding:3px 10px; border-radius:14px; border:2px solid var(--ui-border);
  background:#fff; font-family:'Nunito',sans-serif; font-weight:700;
  font-size:11px; cursor:pointer; color:var(--text-light); transition:all 0.15s;
}
.tab-btn.active { background:var(--green-dark); color:#fff; border-color:var(--green-dark); }
.tab-btn.casino-tab { border-color:#ffd700; color:#7a20c0; }
.tab-btn.casino-tab.active { background:#7a20c0; color:#ffd700; border-color:#ffd700; }
#tab-content { min-height:80px; max-height:120px; overflow-y:auto; }

/* ===== RIGHT SIDEBAR ===== */
#sidebar {
  width:240px; background:var(--panel); border-left:2px solid var(--ui-border);
  display:flex; flex-direction:column; overflow-y:auto;
  padding:10px; gap:10px; flex-shrink:0;
}
.sidebar-section {}
.sidebar-title {
  font-size:11px; font-weight:900; color:var(--text-light);
  text-transform:uppercase; letter-spacing:0.5px;
  margin-bottom:5px; padding-bottom:3px;
  border-bottom:1px solid var(--ui-border);
}
#valley-info { display:flex; align-items:center; gap:5px; font-size:11px; }
#valley-name-display { font-weight:800; color:var(--green-dark); }
#online-count { background:var(--green-dark); color:#fff; border-radius:10px; padding:1px 6px; font-size:10px; font-weight:700; }

/* Ressourcen-Grid */
.res-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.res-row {
  display:flex; align-items:center; gap:4px;
  background:#fff; border:1.5px solid var(--ui-border);
  border-radius:8px; padding:3px 7px; font-size:12px; font-weight:700;
}
.res-row span:last-child { margin-left:auto; color:var(--green-dark); }

/* Aufträge */
.order-card { background:#fff; border:2px solid var(--ui-border); border-radius:8px; padding:6px 8px; margin-bottom:4px; }
.order-card.completable { border-color:var(--green-mid); background:#f0fff0; }
.order-label  { font-size:11px; font-weight:700; color:var(--text); margin-bottom:3px; }
.order-footer { display:flex; align-items:center; justify-content:space-between; }
.order-reward { font-size:11px; color:var(--amber); font-weight:800; }
.order-btn {
  padding:2px 8px; border-radius:6px; border:none;
  background:var(--green-dark); color:#fff;
  font-family:'Nunito',sans-serif; font-weight:700; font-size:10px; cursor:pointer;
}
.order-btn:disabled { background:#ccc; cursor:not-allowed; }

/* Villager Sidebar */
.vil-mini {
  display:flex; align-items:center; gap:5px;
  background:#fff; border:1.5px solid var(--ui-border);
  border-radius:8px; padding:4px 7px; margin-bottom:3px; font-size:11px;
}
.vil-mini .v-name   { font-weight:800; flex:1; font-size:11px; }
.vil-mini .v-status { font-size:10px; color:var(--text-light); }
.vil-mini .v-status.working { color:var(--green-dark); font-weight:700; }
.vil-hunger { display:flex; gap:2px; }
.hd  { width:6px; height:6px; border-radius:50%; background:#ddd; }
.hd.f { background:var(--amber); }
.hd.l { background:var(--red); }
.hire-btn {
  width:100%; padding:5px; border-radius:8px; border:2px dashed var(--green-mid);
  background:transparent; color:var(--green-dark); font-family:'Nunito',sans-serif;
  font-weight:700; font-size:11px; cursor:pointer; transition:all 0.15s; margin-top:2px;
}
.hire-btn:hover  { background:#e8f5e8; }
.hire-btn:disabled { opacity:0.4; cursor:not-allowed; }

/* Mitspieler */
.player-card { display:flex; align-items:center; gap:5px; padding:3px 0; font-size:11px; }
.p-dot { width:7px; height:7px; border-radius:50%; background:#4aaa42; flex-shrink:0; }
.p-name { font-weight:800; flex:1; }
.p-xp   { font-size:10px; color:var(--text-light); }

/* ===== VILLAGER ROWS (Bottom) ===== */
.villager-row {
  display:flex; align-items:center; gap:7px; padding:4px 7px;
  border-radius:8px; margin-bottom:3px; background:#fff;
  border:2px solid var(--ui-border); cursor:pointer;
}
.villager-row.selected { border-color:var(--amber); background:#fffbe8; }
.v-avatar { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.v-name   { font-weight:800; font-size:12px; color:var(--text); flex:1; }
.v-task   { font-size:10px; color:var(--text-light); background:#f0ebe0; border-radius:8px; padding:1px 6px; font-weight:600; }
.v-task.working { color:var(--green-dark); background:#d4f0d4; }
.v-speed  { font-size:10px; color:var(--blue); font-weight:700; min-width:30px; }

/* ===== BUILD CARDS ===== */
.building-grid { display:flex; gap:5px; flex-wrap:wrap; }
.build-card {
  background:#fff; border:2px solid var(--ui-border); border-radius:8px;
  padding:5px 8px; cursor:pointer; transition:all 0.15s;
  display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
}
.build-card:hover  { border-color:var(--green-mid); transform:translateY(-1px); }
.build-card.selected { border-color:var(--amber); background:#fffbe8; }
.build-card.locked  { opacity:0.4; cursor:not-allowed; }
.build-icon  { font-size:16px; }
.build-cost  { font-size:10px; color:var(--text-light); font-weight:600; }

/* ===== CHAINS ===== */
.chain-row {
  display:flex; align-items:center; gap:5px; padding:4px 7px;
  border-radius:7px; background:#fff; border:1.5px solid var(--ui-border);
  margin-bottom:3px; font-size:11px;
}
.chain-step.ready   { color:var(--green-dark); font-weight:800; }
.chain-step.waiting { color:var(--red); font-weight:800; }

/* ===== CASINO ===== */
.casino-wrap    { padding:4px; }
.casino-coins   { font-size:13px; font-weight:900; color:#7a20c0; margin-bottom:6px; }
.casino-section {
  background:rgba(26,10,42,0.06); border:1.5px solid #c0a0e0;
  border-radius:10px; padding:7px 9px; margin-bottom:7px;
}
.casino-title   { font-size:11px; font-weight:900; color:#7a20c0; margin-bottom:6px; }
.casino-result  { font-size:12px; font-weight:800; margin:5px 0; min-height:16px; }
.casino-bets    { display:flex; gap:5px; flex-wrap:wrap; }
.bet-btn {
  padding:3px 10px; border-radius:8px; border:2px solid #9060c0;
  background:#7a20c0; color:var(--casino-gold); font-family:'Nunito',sans-serif;
  font-weight:800; font-size:11px; cursor:pointer; transition:all 0.15s;
}
.bet-btn:hover  { background:#9040e0; }
.bet-btn.green  { background:var(--green-dark); border-color:var(--green-mid); color:#fff; }
.bet-btn.red    { background:var(--red); border-color:#c04040; color:#fff; }

/* Slot */
.slot-display { display:flex; gap:4px; margin:4px 0; }
.slot-reel {
  flex:1; background:#2a1040; border:2px solid var(--casino-gold);
  border-radius:8px; padding:6px 2px; text-align:center;
  font-size:22px; min-height:44px; display:flex; align-items:center; justify-content:center;
  transition:transform 0.05s;
}

/* Blackjack */
.bj-table  { margin:4px 0; }
.bj-hand   { margin-bottom:3px; font-size:11px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.bj-label  { font-weight:800; color:var(--text-light); min-width:45px; }
.bj-card   { background:#fff; border:1.5px solid #bbb; border-radius:5px; padding:1px 5px; font-size:13px; font-weight:800; color:#222; }
.bj-card.red { color:#e00; }
.bj-hidden { font-size:16px; }
.bj-score  { font-size:10px; color:var(--text-light); }
.bj-result { font-size:12px; font-weight:800; min-height:16px; margin:3px 0; }
.bj-actions{ display:flex; gap:5px; }

/* ===== POPUP (FIX: pointer-events) ===== */
#info-popup {
  position:absolute; background:var(--panel); border:2px solid var(--ui-border);
  border-radius:12px; padding:10px 13px; min-width:195px;
  box-shadow:0 4px 16px var(--shadow); z-index:20; display:none;
  pointer-events:all; /* FIX: war 'none' in Phase 2 – Buttons müssen klickbar sein */
}
#info-popup h3 { font-size:13px; font-weight:800; color:var(--text); margin-bottom:2px; }
#info-popup p  { font-size:11px; color:var(--text-light); margin-bottom:3px; }
.chain-info    { font-size:11px; font-weight:700; margin-bottom:5px; }
.assign-btn {
  display:block; width:100%; padding:4px 8px; margin-top:3px;
  border-radius:7px; border:2px solid var(--green-mid); background:var(--green-dark);
  color:#fff; font-family:'Nunito',sans-serif; font-weight:700; font-size:11px;
  cursor:pointer; pointer-events:all;
}
.remove-btn {
  display:block; width:100%; padding:4px 8px; margin-top:3px;
  border-radius:7px; border:2px solid var(--red); background:var(--red);
  color:#fff; font-family:'Nunito',sans-serif; font-weight:700; font-size:11px;
  cursor:pointer; pointer-events:all;
}

/* ===== TRADE POPUP ===== */
#trade-popup {
  position:absolute; bottom:130px; left:50%; transform:translateX(-50%);
  background:var(--panel); border:2px solid var(--ui-border);
  border-radius:14px; padding:0; min-width:240px; max-width:300px;
  box-shadow:0 4px 20px var(--shadow); z-index:25; display:none;
  pointer-events:all;
}

/* ===== NOTIFICATION ===== */
#notif {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  background:var(--green-dark); color:#fff; padding:6px 16px;
  border-radius:18px; font-weight:700; font-size:12px; z-index:30;
  opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap;
}
#notif.show { opacity:1; }

/* Coins Fly Animation */
.coins-fly {
  position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
  font-size:16px; font-weight:900; color:var(--casino-gold);
  animation:flyUp 1.2s ease-out forwards; pointer-events:none; z-index:35;
}
@keyframes flyUp {
  0%   { opacity:1; transform:translate(-50%,-50%); }
  100% { opacity:0; transform:translate(-50%,-200%); }
}

/* Level-Up Overlay */
#levelup-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);
  align-items:center; justify-content:center; z-index:50;
  animation:fadeInOut 2.5s ease-in-out;
}
@keyframes fadeInOut {
  0%,100% { opacity:0; }
  20%,80%  { opacity:1; }
}
.levelup-box {
  background:linear-gradient(135deg,#f0a500,#ff6020);
  border-radius:20px; padding:30px 50px; text-align:center;
  color:#fff; font-size:28px; font-weight:900;
  box-shadow:0 10px 40px rgba(240,100,0,0.5);
}

/* ===== HIRE POPUP ===== */
#hire-popup {
  display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--panel); border:3px solid var(--amber); border-radius:16px;
  padding:20px 28px; z-index:60; text-align:center;
  box-shadow:0 6px 30px var(--shadow); min-width:260px;
}
#hire-popup h3 { font-size:16px; font-weight:900; color:var(--green-dark); margin-bottom:8px; }
#hire-popup p  { font-size:12px; color:var(--text); white-space:pre-line; margin-bottom:12px; }
.hire-close-btn {
  padding:6px 20px; border-radius:10px; border:none;
  background:var(--green-dark); color:#fff;
  font-family:'Nunito',sans-serif; font-weight:700; font-size:12px; cursor:pointer;
}

/* Tab Action Button */
.tab-action-btn {
  margin-top:8px; padding:5px 12px; border-radius:8px; border:2px solid var(--green-mid);
  background:var(--green-dark); color:#fff; font-family:'Nunito',sans-serif;
  font-weight:700; font-size:11px; cursor:pointer;
}

/* ===== CHAT ===== */
#chat-messages {
  max-height:60px; overflow-y:auto; margin-bottom:5px;
  background:#fff; border-radius:7px; border:1.5px solid var(--ui-border); padding:4px 6px;
}
.chat-msg { font-size:11px; margin-bottom:2px; }
.chat-msg.system { color:var(--text-light); font-style:italic; }
.cm-name { font-weight:800; color:var(--green-dark); }
.chat-input-row { display:flex; gap:4px; }
.chat-input-row input {
  flex:1; padding:4px 8px; border-radius:7px; border:1.5px solid var(--ui-border);
  font-family:'Nunito',sans-serif; font-size:11px; outline:none;
}
.chat-input-row button {
  padding:4px 10px; border-radius:7px; border:none; background:var(--green-dark);
  color:#fff; font-family:'Nunito',sans-serif; font-weight:700; font-size:11px; cursor:pointer;
}
</style>
</head>
<body>

<!-- ===== JOIN SCREEN ===== -->
<div id="join-screen">
  <div class="join-card">
    <div class="join-title">🌿 Greendale</div>
    <div class="join-sub">Baue dein Dorf · Teile das Valley · Verdiene Coins</div>
    <input id="player-name-input" class="join-input" type="text" placeholder="Dein Name..." maxlength="20" onkeydown="if(event.key==='Enter')joinValley()">
    <input id="valley-input" class="join-input" type="text" placeholder="Valley-Name (z.B. klasse7a)" maxlength="30" onkeydown="if(event.key==='Enter')joinValley()">
    <button class="join-btn" onclick="joinValley()">🌿 Betreten</button>
    <div id="join-error"></div>
  </div>
</div>

<!-- ===== GAME CONTAINER ===== -->
<div id="game-container">

  <!-- TOPBAR -->
  <div id="topbar">
    <span class="game-title">🌿 Greendale</span>
    <div class="res-chip"><span>🪵</span><span class="res-val" id="res-wood">24</span></div>
    <div class="res-chip"><span>🪨</span><span class="res-val" id="res-stone">12</span></div>
    <div class="res-chip"><span>🌾</span><span class="res-val" id="res-wheat">8</span></div>
    <div class="res-chip"><span>🍲</span><span class="res-val" id="res-soup">4</span></div>
    <div class="res-chip"><span>🪑</span><span class="res-val" id="res-furniture">0</span></div>
    <div class="res-chip"><span>🧱</span><span class="res-val" id="res-brick">0</span></div>
    <div class="res-chip"><span>⚒️</span><span class="res-val" id="res-tool">0</span></div>
    <div id="xp-chip">⭐ <span id="xp-val">0</span></div>
    <div id="coins-chip">🪙 <span id="coins-val">0</span></div>
    <div id="level-chip">🏅 Lvl 1</div>
    <div id="level-bar"><div id="level-bar-fill" style="width:0%"></div></div>
    <div id="time-chip">⏱ Tag 1</div>
    <span id="connection-status" class="disconnected">🔴 Offline</span>
    <button id="save-btn" onclick="saveGame()">💾 Speichern</button>
  </div>

  <!-- MAIN ROW -->
  <div id="main-row">

    <!-- CANVAS SEITE -->
    <div id="canvas-col">
      <div id="canvas-wrap">
        <canvas id="gameCanvas"></canvas>

        <!-- Event Banner -->
        <div id="event-banner"></div>

        <!-- Building Popup (FIX) -->
        <div id="info-popup">
          <h3 id="popup-title"></h3>
          <p  id="popup-desc"></p>
          <div class="chain-info" id="popup-chain"></div>
          <div id="popup-actions"></div>
        </div>

        <!-- Trade Popup -->
        <div id="trade-popup"></div>

        <!-- Notification -->
        <div id="notif"></div>

        <!-- Level-Up Overlay -->
        <div id="levelup-overlay">
          <div class="levelup-box">🏅 LEVEL UP! 🎉</div>
        </div>
      </div>

      <!-- BOTTOM PANEL -->
      <div id="bottom-panel">
        <div id="tabs">
          <button class="tab-btn active"     onclick="switchTab('villagers')">👤 Villager</button>
          <button class="tab-btn"            onclick="switchTab('build')">🏗 Bauen</button>
          <button class="tab-btn"            onclick="switchTab('chains')">⛓ Ketten</button>
          <button class="tab-btn casino-tab" onclick="switchTab('casino')">🎰 Casino</button>
          <button class="tab-btn"            onclick="switchTab('trade')">🤝 Handel</button>
          <button class="tab-btn"            onclick="switchTab('chat')">💬 Chat</button>
        </div>
        <div id="tab-content"></div>
      </div>
    </div>

    <!-- RECHTE SIDEBAR -->
    <div id="sidebar">
      <!-- Valley Info -->
      <div class="sidebar-section">
        <div class="sidebar-title">🏔 Valley</div>
        <div id="valley-info">
